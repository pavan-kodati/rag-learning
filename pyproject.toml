[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "legal-workspace"
version = "0.1.0"
description = "Persistent, evidence-grounded matter memory for Indian commercial and contract litigation (RAG)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3.2",
  "httpx>=0.27",
  "numpy>=1.26",
  "pypdfium2>=4.30",
  "pdfplumber>=0.11",
  "pillow>=10.3",
  "pytesseract>=0.3.10",
  "python-docx>=1.1",
  "rapidfuzz>=3.9",
  "python-dateutil>=2.9",
  "pyjwt>=2.8",
  "pyyaml>=6.0",
  "reportlab>=4.2",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
# Cross-encoder reranker (pulls in PyTorch, ~2 GB). Optional: RERANKER=cross_encoder
rerank = ["sentence-transformers>=3.0"]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-pyyaml",
  "types-python-dateutil",
  "types-reportlab",
]

[project.scripts]
lw-api = "legal_workspace.api.main:run"
lw-worker = "legal_workspace.worker:main"
lw-migrate = "legal_workspace.db.migrate:main"
lw-synth = "legal_workspace.synthetic.generate:main"
lw-eval = "legal_workspace.eval.runner:main"
lw-corpus = "legal_workspace.corpus.loader:main"

[tool.hatch.build.targets.wheel]
packages = ["src/legal_workspace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "db: needs a PostgreSQL + pgvector instance (TEST_DATABASE_URL)",
  "e2e: full pipeline replay of the synthetic matters",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
