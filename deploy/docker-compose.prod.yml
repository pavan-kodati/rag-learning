# Single-VM production overlay. Normally driven by deploy/deploy.sh (see docs/AWS_DEPLOYMENT_GUIDE.md).
# Images are built on the server by `deploy.sh up` (IMAGE_TAG just names them). Adds: TLS reverse proxy (Caddy), no public DB/Ollama ports, restart policies, secrets from env, resource limits, worker scale-out.
# Validated with `docker compose config` only; never run end to end in the build environment: review before first use.
x-restart: &restart
  restart: unless-stopped

services:
  db:
    <<: *restart
    ports: !reset []
    environment:
      POSTGRES_USER: lw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env.prod}
      POSTGRES_DB: legal_workspace
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "max_connections=100"]

  api:
    <<: *restart
    image: ghcr.io/pavan-kodati/rag-learning/api:${IMAGE_TAG:?set IMAGE_TAG to a commit SHA built by CI}
    ports: !reset []
    environment:
      DATABASE_URL: postgresql://lw:${POSTGRES_PASSWORD}@db:5432/legal_workspace
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      AUTH_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      AUTH_USERS: ${AUTH_USERS:?set AUTH_USERS, e.g. alice:strong-pw:admin}
      LOG_JSON: "true"
      CORS_ORIGINS: https://${PUBLIC_HOST:?set PUBLIC_HOST}
    deploy:
      resources: { limits: { memory: 2g } }

  worker:
    <<: *restart
    image: ghcr.io/pavan-kodati/rag-learning/api:${IMAGE_TAG:?set IMAGE_TAG to a commit SHA built by CI}
    environment:
      DATABASE_URL: postgresql://lw:${POSTGRES_PASSWORD}@db:5432/legal_workspace
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      LOG_JSON: "true"
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
      resources: { limits: { memory: 4g } }

  ollama:
    <<: *restart
    ports: !reset []

  ui:
    <<: *restart
    image: ghcr.io/pavan-kodati/rag-learning/ui:${IMAGE_TAG:?set IMAGE_TAG to a commit SHA built by CI}
    ports: !reset []

  proxy:
    <<: *restart
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [api, ui]

volumes:
  caddy_data:
